[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-classic-control"
version = "0.1.0"
description = "A simple interface to control the SO101 arm with joint, gripper, and Cartesian (FK/IK) control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pin",
    "lerobot",
]

[tool.setuptools.packages.find]
include = ["so101_control*"]

[tool.setuptools.package-data]
so101_control = ["urdf/**/*", "calibration/**/*"]
